name: Release

# Publishes to the VS Code Marketplace when you push a tag like v0.0.5.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tag must match package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "refs/tags/v$v" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF does not match package.json version $v"; exit 1
          fi

      - run: npm test
      - run: npx --yes @vscode/vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
