name: Publish

# Publishes to the VS Code Marketplace when you push a tag like v0.0.5.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # The git tag is the source of truth: v1.2.3 publishes version 1.2.3.
      - run: npx @vscode/vsce publish "${GITHUB_REF_NAME#v}" --no-git-tag-version --oidc
